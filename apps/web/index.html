<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Minecraft Server Manager</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script>
      (() => {
        const cryptoApi = globalThis.crypto;
        if (!cryptoApi || typeof cryptoApi.randomUUID === "function" || typeof cryptoApi.getRandomValues !== "function") {
          return;
        }

        const byteToHex = Array.from({ length: 256 }, (_, index) => index.toString(16).padStart(2, "0"));

        cryptoApi.randomUUID = () => {
          const bytes = cryptoApi.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;

          return [
            byteToHex[bytes[0]],
            byteToHex[bytes[1]],
            byteToHex[bytes[2]],
            byteToHex[bytes[3]],
            "-",
            byteToHex[bytes[4]],
            byteToHex[bytes[5]],
            "-",
            byteToHex[bytes[6]],
            byteToHex[bytes[7]],
            "-",
            byteToHex[bytes[8]],
            byteToHex[bytes[9]],
            "-",
            byteToHex[bytes[10]],
            byteToHex[bytes[11]],
            byteToHex[bytes[12]],
            byteToHex[bytes[13]],
            byteToHex[bytes[14]],
            byteToHex[bytes[15]],
          ].join("");
        };
      })();
    </script>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; margin: 2rem; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
      input, select, textarea { padding: .5rem; margin: .25rem 0; width: 100%; }
      button { padding: .6rem 1rem; margin-right: .5rem; cursor: pointer; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .75rem; }
      pre { background: #111; color: #0f0; padding: .75rem; border-radius: 8px; overflow: auto; max-height: 320px; }
      .drop { border: 2px dashed #aaa; border-radius: 10px; padding: .5rem; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
